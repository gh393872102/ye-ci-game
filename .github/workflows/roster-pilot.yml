name: Encrypted roster artwork - pilot
on:
  push:
    branches: [codex/zhusha-ten-styles-20261120]
    paths: [.github/workflows/roster-pilot.yml]
permissions:
  contents: read
jobs:
  render:
    if: github.run_attempt == 1 && github.event.before == 'd4881334172e24c06350abe1d9c8fc54a24c6bec'
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0]
    env:
      SLOT: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/wan-style-pilot
            tools/art-delivery
      - name: Generate ephemeral input recipient
        run: |
          umask 077
          openssl req -x509 -newkey rsa:3072 -nodes -days 1 -subj /CN=InputRecipient -keyout "$RUNNER_TEMP/input.key" -out "$RUNNER_TEMP/input.pem" 2>/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-request-${{ matrix.shard }}
          path: ${{ runner.temp }}/input.pem
          retention-days: 1
      - name: Prepare image CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/env"
          "$RUNNER_TEMP/env/bin/pip" -q install 'openai>=2,<3' 'pillow>=11,<13'
      - name: Receive encrypted inputs
        run: |
          set -eu
          dest="tools/art-delivery/pilot-$SLOT.cms"
          for attempt in {1..150}; do
            remote=$(git ls-remote origin refs/heads/codex/zhusha-ten-styles-20261120 | cut -f1)
            if [[ "$remote" != "$GITHUB_SHA" ]]; then
              git fetch -q --depth=1 origin "$remote"
              if git show "FETCH_HEAD:$dest" > "$RUNNER_TEMP/in.cms" 2>/dev/null; then break; fi
            fi
            sleep 10
          done
          openssl cms -decrypt -binary -inform DER -in "$RUNNER_TEMP/in.cms" -inkey "$RUNNER_TEMP/input.key" -recip "$RUNNER_TEMP/input.pem" -out "$RUNNER_TEMP/in.zip"
          mkdir -p "$RUNNER_TEMP/inputs"
          cd "$RUNNER_TEMP/inputs"
          unzip -q "$RUNNER_TEMP/in.zip" jobs.json art.txt sprite.txt style.jpg
          echo '15d9426734f7fc9f834f496793ed8eeda61ebe0a1c5f298fe49ed3231c89e28a  style.jpg' | sha256sum --check --status
      - name: Render commissioned assets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.openai.com/v1
        run: |
          test -n "$OPENAI_API_KEY"
          "$RUNNER_TEMP/env/bin/python" tools/art-delivery/render.py
      - name: Seal available results
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/results" ]]; then
            cd "$RUNNER_TEMP/results"
            zip -q -0 "$RUNNER_TEMP/results.zip" ./*
            openssl cms -encrypt -binary -aes-256-gcm -outform DER -in "$RUNNER_TEMP/results.zip" -out "$RUNNER_TEMP/result.cms" "$GITHUB_WORKSPACE/tools/art-delivery/receiver.pem"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-result-${{ matrix.shard }}
          path: ${{ runner.temp }}/result.cms
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
