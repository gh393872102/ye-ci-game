name: Complete the missing A2 portrait
on:
  push:
    branches: [codex/six-combat-portraits-20261120]
    paths: [.github/workflows/six-combat-portraits.yml]
permissions:
  contents: read
jobs:
  draw:
    if: github.run_attempt == 1 && github.event.before == 'cc91596dbfa754eb609d6a4754b3596b192820eb'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare project image generator
        run: |
          python3 -m venv "$RUNNER_TEMP/portraits-env"
          "$RUNNER_TEMP/portraits-env/bin/python" -m pip install 'openai>=2,<3'
          sed 's/return AsyncOpenAI()/return AsyncOpenAI(max_retries=0)/' tools/wan-style-pilot/image_gen.py > "$RUNNER_TEMP/image_gen.py"
          grep -q 'AsyncOpenAI(max_retries=0)' "$RUNNER_TEMP/image_gen.py"
      - name: Draw missing A2 portrait
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.openai.com/v1
        run: |
          test -n "$OPENAI_API_KEY"
          if ! "$RUNNER_TEMP/portraits-env/bin/python" "$RUNNER_TEMP/image_gen.py" generate-batch \
            --input tools/wan-style-pilot/six-combat-A2.jsonl --out-dir "$RUNNER_TEMP/portraits" \
            --model gpt-image-2 --quality high --size 1024x1536 --concurrency 3 --max-attempts 1 --no-augment \
            > "$RUNNER_TEMP/portraits.log" 2>&1; then
            grep -Eo 'Error code: [0-9]{3}|insufficient_quota|rate_limit_exceeded|invalid_api_key|model_not_found|billing_hard_limit_reached' "$RUNNER_TEMP/portraits.log" | sort -u || true
            exit 1
          fi
          test -s "$RUNNER_TEMP/portraits/A2.png"
      - name: Encrypt completed original images
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          images=("$RUNNER_TEMP"/portraits/*.png)
          if (( ${#images[@]} )); then
            zip -q -j "$RUNNER_TEMP/portraits.zip" "${images[@]}"
            openssl cms -encrypt -binary -aes-256-gcm -outform DER -in "$RUNNER_TEMP/portraits.zip" -out "$RUNNER_TEMP/portraits.cms" tools/wan-style-pilot/six-delivery-public.pem
          fi
      - name: Deliver encrypted originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-A2-encrypted
          path: ${{ runner.temp }}/portraits.cms
          if-no-files-found: ignore
          retention-days: 7
